name: AI CI/CD Pipeline

on: workflow_dispatch

env:
  IMAGE_NAME: fastapi-app
permissions:
  contents: write


jobs:
  test:
    runs-on: ubuntu-22.04
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-html || true

      - name: Run Tests
        run: |
          pytest \
          --junitxml=report.xml \
          --cov=app \
          --cov-report=xml \
          --cov-report=html \
          --html=report.html \
          --self-contained-html \
          --cov-fail-under=80

      - name: Extract Coverage %
        run: |
          python <<EOF
          import xml.etree.ElementTree as ET
          import json
          tree = ET.parse("coverage.xml")
          root = tree.getroot()
          coverage = float(root.attrib.get("line-rate", 0)) * 100
          with open("status.json", "w") as f:
              json.dump({
                  "tests": "passed",
                  "coverage": round(coverage, 2),
                  "lint": "unknown",
                  "security": "unknown",
                  "dependency": "unknown"
              }, f)
          EOF

      - name: Upload Test Reports + Status
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            report.xml
            report.html
            coverage.xml
            htmlcov/
            status.json

  lint:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: test-report

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linter
        run: pip install flake8 flake8-html

      - name: Run Lint
        run: |
          flake8 . --format=html --htmldir=flake8-report || true
          ERRORS=$(flake8 . --count --max-line-length=120 2>/dev/null | tail -n 1)

          python <<EOF
          import json
          with open("status.json") as f:
              status = json.load(f)
          try:
              errors = int("$ERRORS".strip())
          except:
              errors = 1
          status["lint"] = "warning" if errors > 0 else "passed"
          with open("status.json", "w") as f:
              json.dump(status, f)
          EOF

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            flake8-report
            status.json

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lint-report

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Security Scan
        run: |
          bandit -r app/ -f json -o bandit-report.json || true
          bandit -r app/ -f html -o bandit-report.html || true

          python <<EOF
          import json
          with open("status.json") as f:
              status = json.load(f)
          data = json.load(open("bandit-report.json"))
          issues = data.get("results", [])
          status["security"] = "passed" if len(issues) == 0 else "warning"
          with open("status.json", "w") as f:
              json.dump(status, f)
          EOF

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            bandit-report.*
            status.json

  dependency-scan:
    runs-on: ubuntu-latest
    needs: security
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: security-report

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies + pip-audit
        run: |
          pip install -r requirements.txt
          pip install pip-audit

      - name: Run Dependency Scan
        run: |

          pip-audit -r requirements.txt -f json -o dependency-report.json || true

          python <<EOF
          import json

          with open("dependency-report.json") as f:
              data = json.load(f)

          html = """
          <html>
          <head>
              <title>Dependency Report</title>

              <style>
                  body{
                      font-family:Arial;
                      background:#111827;
                      color:white;
                      padding:30px;
                  }

                  h1{
                      color:#f59e0b;
                  }

                  .card{
                      background:#1f2937;
                      padding:20px;
                      margin-bottom:20px;
                      border-radius:12px;
                  }

                  .vuln{
                      color:#ef4444;
                  }

                  .safe{
                      color:#22c55e;
                  }
              </style>
          </head>

          <body>

              <h1>📦 Dependency Vulnerability Report</h1>
          """

          vulns = 0

          for dep in data.get("dependencies", []):

              package = dep.get("name")
              version = dep.get("version")
              issues = dep.get("vulns", [])

              html += f"<div class='card'>"
              html += f"<h2>{package} ({version})</h2>"

              if not issues:
                  html += "<p class='safe'>✔ No vulnerabilities</p>"

              else:

                  vulns += len(issues)

                  for v in issues:
                      html += f"""
                      <div class='vuln'>
                          <p><b>ID:</b> {v.get("id")}</p>
                          <p><b>Fix Versions:</b> {v.get("fix_versions")}</p>
                      </div>
                      <hr>
                      """

              html += "</div>"

          html += "</body></html>"

          with open("dependency-report.html", "w") as f:
              f.write(html)

          # STATUS UPDATE

          with open("status.json") as f:
              status = json.load(f)

          status["dependency"] = "passed" if vulns == 0 else "warning"

          with open("status.json", "w") as f:
              json.dump(status, f)

          EOF

      - name: Upload Dependency Reports
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: |
            dependency-report.json
            status.json
            dependency-report.html

  ai-analysis:
    runs-on: ubuntu-latest
    needs: dependency-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dependency-report

      - name: Prepare AI Input
        run: cat status.json > ai-input.txt

      - name: Call Local Ollama API via Tunnel
        env:
          OLLAMA_URL: ${{ secrets.OLLAMA_BASE_URL }}
        run: |
          INPUT=$(cat ai-input.txt)

          JSON_PAYLOAD=$(jq -n \
            --arg text "You are a senior DevOps engineer. Analyze this CI/CD pipeline result and suggest improvements:\n$INPUT" \
            '{
              model: "mistral",
              messages: [
                { role: "user", content: $text }
              ],
              stream: false
            }')

          curl "$OLLAMA_URL/v1/chat/completions" \
            -s \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            > ai-response.json

      - name: Debug AI Response
        run: cat ai-response.json

      - name: Extract AI Summary (Robust)
        run: |
          python <<EOF
          import json

          try:
              with open("ai-response.json") as f:
                  raw = f.read().strip()
              if not raw:
                  raise ValueError("ai-response.json रिकामी आहे! टनेल पब्लिक आहे का ते तपासा.")
              data = json.loads(raw)
          except Exception as e:
              print(f"Error: {e}")
              exit(1)

          # /v1/chat/completions मधून उत्तर काढण्यासाठी
          text = ""
          if "choices" in data and len(data["choices"]) > 0:
              text = data["choices"][0].get("message", {}).get("content", "")
          elif "response" in data:
              text = data.get("response", "")
          else:
              text = json.dumps(data, indent=2)

          with open("ai-report.txt", "w") as f:
              f.write(text)

          print(text)
          EOF

      - name: Show AI Summary in UI
        run: |
          echo "## 🤖 AI DevOps Insights" >> $GITHUB_STEP_SUMMARY
          cat ai-report.txt >> $GITHUB_STEP_SUMMARY

      - name: Upload AI Report
        uses: actions/upload-artifact@v4
        with:
          name: ai-report
          path: ai-report.txt

  deploy-report:
    needs: ai-analysis
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Download AI Report Artifact
        uses: actions/download-artifact@v4
        with:
          name: ai-report

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
